<div class="card" (click)="onCardClick()">
  @if (title) {
    <div class="card-header">
      {{ title }}
    </div>
  }
  <div class="card-body">
    <ng-content></ng-content>
  </div>
  @if (footer) {
    <div class="card-footer">
      <ng-content select="[card-footer]"></ng-content>
    </div>
  }
</div>

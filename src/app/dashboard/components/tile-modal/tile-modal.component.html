@if (isOpen) {
  <div class="modal-overlay" (click)="onClose()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <div class="modal-header">
        <h2>{{ mode === 'create' ? 'Add New Tile' : 'Edit Tile' }}</h2>
        <button class="close-btn" (click)="onClose()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            [(ngModel)]="formData.title"
            placeholder="Enter tile title"
            class="form-control">
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type" [(ngModel)]="formData.type" class="form-control">
            @for (type of tileTypes; track type) {
              <option [value]="type">{{ type }}</option>
            }
          </select>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="width">Width</label>
            <input
              type="number"
              id="width"
              [(ngModel)]="formData.size!.width"
              min="1"
              max="12"
              class="form-control">
          </div>
          <div class="form-group">
            <label for="height">Height</label>
            <input
              type="number"
              id="height"
              [(ngModel)]="formData.size!.height"
              min="1"
              max="6"
              class="form-control">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="x">Position X</label>
            <input
              type="number"
              id="x"
              [(ngModel)]="formData.position!.x"
              min="0"
              class="form-control">
          </div>
          <div class="form-group">
            <label for="y">Position Y</label>
            <input
              type="number"
              id="y"
              [(ngModel)]="formData.position!.y"
              min="0"
              class="form-control">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button class="btn btn-primary" (click)="onSave()">
          {{ mode === 'create' ? 'Create' : 'Update' }}
        </button>
      </div>
    </div>
  </div>
}

<div class="dashboard-container">
  <div class="dashboard-header">
    <h1>Dashboard</h1>
    <div class="dashboard-actions">
      <!-- <app-button
        [label]="'button'">
      </app-button> -->
      <button class="btn btn-primary" (click)="openCreateModal()">
        + Add Tile
      </button>
      <button class="btn btn-secondary" (click)="loadTiles()">
        🔄 Refresh
      </button>
      <button class="btn btn-danger" (click)="clearDashboard()">
        🗑️ Clear All
      </button>
    </div>
  </div>

  @if (!isLoading) {
    <div class="dashboard-content">
      <div
        class="dashboard-grid"
        [style.grid-template-columns]="'repeat(' + columns + ', 1fr)'"
        [style.gap.px]="gap"
        cdkDropList
        [cdkDropListDisabled]="!enableDragDrop"
        (cdkDropListDropped)="onDrop($event)">
        @for (tile of tiles; track tile) {
          <div
            class="grid-item"
            [ngStyle]="getTileGridStyle(tile)"
            cdkDrag
            [cdkDragDisabled]="!enableDragDrop">
            <app-tile
              [tile]="tile"
              [isDraggable]="enableDragDrop"
              (edit)="openEditModal($event)"
              (delete)="deleteTile($event)">
            </app-tile>
          </div>
        }
      </div>
      @if (tiles.length === 0) {
        <div class="empty-state">
          <div class="empty-state-content">
            <span class="empty-icon">📊</span>
            <h2>No tiles yet</h2>
            <p>Start by adding your first tile to the dashboard</p>
            <button class="btn btn-primary btn-large" (click)="openCreateModal()">
              + Add Your First Tile
            </button>
          </div>
        </div>
      }
    </div>
  }

  <!-- <app-card [title]="'testing title'" [footer]="true"></app-card> -->

  @if (isLoading) {
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading dashboard...</p>
    </div>
  }
</div>

<app-tile-modal
  [isOpen]="isModalOpen"
  [tile]="selectedTile"
  [mode]="modalMode"
  (save)="saveTile($event)"
  (close)="closeModal()">
</app-tile-modal>
